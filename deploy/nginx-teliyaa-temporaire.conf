# Teliyaa SANS domaine (en attendant teliyaa.com) : accès par http://IP_DU_SERVEUR:8080
# Port 8080 pour ne pas gêner tes autres sites sur le port 80.
# À remplacer par nginx-teliyaa.conf dès que le domaine est acheté.
#
#   cp deploy/nginx-teliyaa-temporaire.conf /etc/nginx/sites-available/teliyaa
#   ln -s /etc/nginx/sites-available/teliyaa /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Limites en http (sans https) : la recherche « Mes contacts » et l'app mobile ne marchent pas
# (le navigateur exige https). La connexion, le profil, les comptes et la page publique marchent.

server {
    listen 8080;
    server_name _;

    client_max_body_size 200k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

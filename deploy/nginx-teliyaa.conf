# Teliyaa derrière ton Nginx (installé directement sur la machine).
# À copier dans /etc/nginx/sites-available/teliyaa puis :
#   ln -s /etc/nginx/sites-available/teliyaa /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Certificat : certbot --nginx -d teliyaa.com -d www.teliyaa.com
# (adapte les chemins ci-dessous si tes certificats sont ailleurs)

server {
    listen 80;
    server_name teliyaa.com www.teliyaa.com;
    return 301 https://teliyaa.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.teliyaa.com;
    ssl_certificate     /etc/letsencrypt/live/teliyaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teliyaa.com/privkey.pem;
    return 301 https://teliyaa.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name teliyaa.com;

    ssl_certificate     /etc/letsencrypt/live/teliyaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teliyaa.com/privkey.pem;

    # Contacts : jusqu'à 500 empreintes par requête
    client_max_body_size 200k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'app lit l'IP du visiteur ici (limites anti-abus) : on remplace, on n'ajoute pas
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
